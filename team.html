<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meet the creative team behind TO•PIC Media Design Studio — graphic designers, motion artists, 3D modelers, and photographers." />
  <title>TO•PIC — Team</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='15' y='9' width='34' height='9.5' fill='%23111'/%3E%3Cpath d='M20 33.5H32V21.5C25.37 21.5 20 26.87 20 33.5Z' fill='%23111'/%3E%3Crect x='20' y='36.5' width='12' height='16' fill='%23111'/%3E%3Cpath d='M34 21.5C40.63 21.5 46 26.87 46 33.5C46 40.13 40.63 45.5 34 45.5V21.5Z' fill='%23b81d24'/%3E%3C/svg%3E">
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');
    } catch (e) {}
  </script>

  <link rel="preload" as="image" href="Photo/Set2_แบม 4.webp" fetchpriority="high">
  <link rel="preload" as="image" href="redpic/แบม.webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"></noscript>

  <style>
    @view-transition {
      navigation: auto;
    }

    html {
      scrollbar-gutter: stable;
    }

    :root,
    [data-theme="light"] {
      --container-max: 1440px;
      --side-pad: clamp(24px, 5vw, 72px);

      --bg-color: #efefef;
      --nav-bg: rgba(239, 239, 239, 0.92);
      --surface-color: #ffffff;
      --text-primary: #111111;
      --text-secondary: #555555;
      --accent-red: #b81d24;
      --border-color: rgba(0, 0, 0, 0.12);
      --card-shadow: 0 14px 32px rgba(0, 0, 0, 0.12);
      --toggle-border: #111111;
    }

    [data-theme="dark"] {
      --bg-color: #0e0e0e;
      --nav-bg: rgba(14, 14, 14, 0.92);
      --surface-color: #181818;
      --text-primary: #f4f4f4;
      --text-secondary: #9e9e9e;
      --accent-red: #e6323a;
      --border-color: rgba(255, 255, 255, 0.14);
      --card-shadow: 0 16px 38px rgba(0, 0, 0, 0.65);
      --toggle-border: #f4f4f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: var(--side-pad);
      padding-right: var(--side-pad);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 88px;
      z-index: 1000;
      background-color: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      transition: background-color 0.35s ease;
    }

    .nav-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 2px;
      cursor: pointer;
    }

    .topic-logo-svg {
      width: 48px;
      height: 48px;
      overflow: visible;
      display: block;
    }

    .logo-stem,
    .logo-top-bar {
      fill: var(--text-primary);
      transition: fill 0.35s ease;
    }

    .logo-red-half {
      fill: var(--accent-red);
      transition: fill 0.35s ease;
    }

    .logo-top-bar {
      transform-box: view-box;
      transform-origin: 32px 18px;
      transform: translate(-5px, 4px) rotate(-38deg);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.35s ease;
    }

    .brand-logo:hover .logo-top-bar,
    .brand-logo:active .logo-top-bar {
      transform: translate(0, 0) rotate(0deg);
    }

    nav.nav-links {
      position: relative;
      display: flex;
      align-items: center;
      gap: 48px;
    }

    nav.nav-links a {
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-primary);
      text-transform: uppercase;
      padding: 8px 4px;
      display: inline-block;
      white-space: nowrap;
      transition: color 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    nav.nav-links a:hover {
      transform: scale(1.08);
      color: var(--accent-red);
    }

    nav.nav-links a.active {
      color: var(--accent-red);
    }

    .nav-underline {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2.5px;
      width: 1px;
      background-color: var(--accent-red);
      border-radius: 2px;
      transform-origin: left center;
      will-change: transform;
      view-transition-name: nav-underline;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .nav-controls {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.25s ease, transform 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--accent-red);
      transform: scale(1.06);
    }

    .theme-toggle {
      width: 56px;
      height: 28px;
      border-radius: 999px;
      border: 1.5px solid var(--toggle-border);
      background: transparent;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      transition: border-color 0.35s ease;
    }

    .theme-icon {
      width: 14px;
      height: 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .sun-icon { color: #fff; }
    .moon-icon { color: var(--text-primary); opacity: 0.65; }
    [data-theme="dark"] .sun-icon { color: var(--text-primary); opacity: 0.55; }
    [data-theme="dark"] .moon-icon { color: #fff; opacity: 1; }

    .theme-knob {
      position: absolute;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.35s ease;
      z-index: 1;
    }

    [data-theme="dark"] .theme-knob {
      transform: translateX(27px);
    }

    .team-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 88px 0 0;
      overflow: hidden;
    }

    .slideshow-box {
      position: relative;
      width: 100%;
      max-width: var(--container-max);
      height: calc(100svh - 88px);
      min-height: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(32px, 6vw, 96px);
      padding: 0 var(--side-pad);
    }

    .left-side {
      position: relative;
      width: 56%;
      height: 100%;
      overflow: visible;
      clip-path: inset(-120px -160px 0px -160px);
    }

    .left-motion {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding-left: clamp(20px, 4vw, 60px);
    }

    .person-img {
      position: relative;
      height: 170%;
      width: auto;
      max-width: none;
      object-fit: contain;
      object-position: bottom left;
      transform: translate3d(var(--person-x, 0px), var(--head-offset, 20%), 0);
      opacity: 0.98;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.08));
      user-select: none;
      pointer-events: none;
    }

    [data-theme="dark"] .person-img {
      filter: drop-shadow(0 22px 34px rgba(0, 0, 0, 0.55));
    }

    .left-text-group {
      position: absolute;
      bottom: 16%;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      max-width: 96%;
      z-index: 2;
      pointer-events: none;
    }

    .first-name-img,
    .last-name-img {
      width: 330px;
      max-width: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.09));
    }

    .last-name-img {
      margin-left: clamp(24px, 3.5vw, 48px);
    }

    .first-name-img[src=""],
    .last-name-img[src=""] {
      display: none;
    }

    [data-theme="dark"] .first-name-img,
    [data-theme="dark"] .last-name-img,
    [data-theme="dark"] .right-text-img {
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
    }

    .right-side {
      position: relative;
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-bottom: 110px;
      z-index: 3;
    }

    .red-photo {
      width: clamp(250px, 21vw, 310px);
      height: clamp(250px, 21vw, 310px);
      object-fit: contain;
      background: transparent;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 22px 32px rgba(0, 0, 0, 0.14);
      will-change: transform;
      animation: floatRedPhoto 4.2s ease-in-out infinite;
    }

    [data-theme="dark"] .red-photo {
      box-shadow: 0 24px 36px rgba(0, 0, 0, 0.65);
    }

    @keyframes floatRedPhoto {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -8px, 0); }
    }

    .right-text-img {
      position: relative;
      left: 5px;
      height: clamp(36px, 3.2vw, 46px);
      width: auto !important;
      max-width: 100%;
      object-fit: contain;
      object-position: left center;
      display: block;
      margin-bottom: 4px;
      pointer-events: none;
    }

    .member-role {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      font-size: clamp(16px, 1.55vw, 22px);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text-secondary);
      margin-top: 2px;
      margin-left: clamp(28px, 3.8vw, 56px);
      pointer-events: none;
    }

    .red-arrows {
      position: absolute;
      bottom: 44px;
      right: var(--side-pad);
      display: flex;
      gap: 48px;
      z-index: 10;
    }

    .arrow-btn {
      position: relative;
      overflow: hidden;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background-color: #fff;
      color: #111;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    [data-theme="dark"] .arrow-btn {
      background-color: #242424;
      color: #f4f4f4;
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7);
    }

    .arrow-btn:hover {
      transform: scale(1.1);
      background-color: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    .arrow-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 820px) {
      :root { --side-pad: 14px; }
      header { height: 64px; }
      .nav-inner { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .brand-logo { flex-shrink: 0; }
      .topic-logo-svg { width: 34px; height: 34px; }
      nav.nav-links { gap: clamp(8px, 2.8vw, 18px); min-width: 0; }
      nav.nav-links a { font-size: clamp(10px, 2.8vw, 12px); letter-spacing: 0.03em; padding: 6px 2px; }
      .nav-controls { gap: 8px; flex-shrink: 0; }
      .lang-btn { font-size: 11px; gap: 3px; }
      .theme-toggle { width: 42px; height: 22px; padding: 0 4px; }
      .theme-icon { width: 10px; height: 10px; }
      .theme-knob { width: 15px; height: 15px; left: 3px; }
      [data-theme="dark"] .theme-knob { transform: translateX(19px); }

      .team-stage { padding: 64px 0 0; justify-content: center; }
      .slideshow-box {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        height: clamp(355px, 86vw, 560px);
        min-height: 0;
        gap: clamp(8px, 2.5vw, 24px);
        padding: 0 var(--side-pad);
      }

      .left-side {
        width: 57%;
        height: 100%;
        clip-path: inset(-200px -300px 0px -300px);
      }

      .left-motion {
        justify-content: flex-start;
        padding-left: 0;
      }

      .person-img {
        height: 146%;
        transform: translate3d(calc(clamp(-42px, -9vw, -22px) + var(--person-x, 0px) * 0.35), var(--head-offset, 20%), 0);
      }

      .left-text-group {
        left: 0 !important;
        transform: none;
        align-items: flex-start;
        bottom: 15% !important;
        gap: 2px !important;
      }

      .first-name-img,
      .last-name-img {
        width: clamp(138px, 37vw, 245px) !important;
        margin-left: 0;
      }

      .last-name-img {
        margin-left: clamp(10px, 3vw, 28px);
      }

      .right-side {
        width: 41%;
        align-items: flex-start;
        text-align: left;
        padding-bottom: clamp(48px, 11vw, 84px);
      }

      .red-photo {
        width: clamp(120px, 31.5vw, 220px);
        height: clamp(120px, 31.5vw, 220px);
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .right-text-img {
        left: clamp(4px, 1.4vw, 6px) !important;
        top: 0 !important;
        height: clamp(20px, 5vw, 34px);
        object-position: left center;
      }
      .member-role {
        margin-left: clamp(12px, 3.4vw, 32px);
        font-size: clamp(11px, 2.8vw, 16px);
      }
      .red-arrows { right: var(--side-pad); transform: none; bottom: 10px; gap: clamp(14px, 4vw, 28px); }
      .arrow-btn { width: 38px; height: 38px; font-size: 14px; }
    }

    @media (max-width: 390px) {
      :root { --side-pad: 10px; }
      .nav-inner { gap: 4px; }
      nav.nav-links { gap: 6px; }
      nav.nav-links a { font-size: 9.5px; letter-spacing: 0.01em; }
      .topic-logo-svg { width: 28px; height: 28px; }
      .nav-controls { gap: 6px; }
      .lang-btn { font-size: 10px; }
      .theme-toggle { width: 38px; height: 20px; }
      .theme-knob { width: 14px; height: 14px; }
      [data-theme="dark"] .theme-knob { transform: translateX(17px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo" id="brandLogo" aria-label="TO•PIC Home">
        <svg class="topic-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect class="logo-top-bar" x="15" y="9" width="34" height="9.5" />
          <path class="logo-stem" d="M20 33.5H32V21.5C25.3726 21.5 20 26.8726 20 33.5Z" />
          <rect class="logo-stem" x="20" y="36.5" width="12" height="16" />
          <path class="logo-red-half" d="M34 21.5C40.6274 21.5 46 26.8726 46 33.5C46 40.1274 40.6274 45.5 34 45.5V21.5Z" />
        </svg>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Main">
        <a href="index.html" data-nav="home" data-en="HOME" data-th="หน้าแรก">HOME</a>
        <a href="work.html" data-nav="work" data-en="WORK" data-th="ผลงาน">WORK</a>
        <a href="team.html" class="active" aria-current="page" data-nav="team" data-en="TEAM" data-th="ทีมงาน">TEAM</a>
        <a href="index.html#contact" data-nav="contact" data-en="CONTACT" data-th="ติดต่อ">CONTACT</a>
        <div class="nav-underline" id="navUnderline"></div>
      </nav>

      <div class="nav-controls">
        <button class="lang-btn" id="langToggle" type="button" aria-label="Change language">
          🌐 <span id="langText">TH</span>
        </button>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light / dark mode" title="Switch Theme">
          <span class="theme-icon sun-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </span>
          <span class="theme-icon moon-icon">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
          </span>
          <div class="theme-knob"></div>
        </button>

  <div class="team-stage">
    <main class="slideshow-box" id="slideshowBox">

      <div class="left-side" id="leftZone">
        <div class="left-motion" id="leftMotion">
          <img id="personImg" class="person-img" src="Photo/Set2_แบม 4.webp" alt="Member" fetchpriority="high">
          <div class="left-text-group" id="leftTextGroup">
            <img id="firstNameImg" class="first-name-img" src="แบม/PICHAYADA.webp" alt="First Name">
            <img id="lastNameImg" class="last-name-img" src="แบม/MAOSRI.webp" alt="Last Name">
          </div>
        </div>
      </div>

      <div class="right-side" id="rightZone">
        <img id="redPhoto" class="red-photo" src="redpic/แบม.webp" alt="Profile" width="310" height="310" fetchpriority="high">
        <img id="rightTextImg" class="right-text-img" src="ชื่อเล่น/BAM.webp" alt="Nickname">
        <p id="memberRole" class="member-role">Graphic Design</p>
      </div>

      <div class="red-arrows">
        <button class="arrow-btn" id="prevMember" type="button" aria-label="Previous member">←</button>
        <button class="arrow-btn" id="nextMember" type="button" aria-label="Next member">→</button>
      </div>

    </main>
  </div>

  <script>
    const html = document.documentElement;

    const themeToggle = document.getElementById('themeToggle');
    html.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');

    themeToggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('topic-theme', next);
    });

    const navLinks = [...document.querySelectorAll('#navLinks a')];
    const underline = document.getElementById('navUnderline');
    const currentTab = document.querySelector('#navLinks a.active') || navLinks[2];

    function moveUnderline(link, instant = false) {
      if (!link || !underline) return;
      navLinks.forEach(a => a.classList.remove('active'));
      link.classList.add('active');

      const x = link.offsetLeft;
      const w = link.offsetWidth;

      if (instant) {
        underline.style.transition = 'none';
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
        underline.offsetHeight;
        underline.style.transition = '';
      } else {
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
      }
    }

    function initNavPosition() {
      const saved = sessionStorage.getItem('topic-prev-nav');
      if (saved) {
        sessionStorage.removeItem('topic-prev-nav');
        const { x, w } = JSON.parse(saved);
        underline.style.transition = 'none';
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
        underline.offsetHeight;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            underline.style.transition = '';
            moveUnderline(currentTab, false);
          });
        });
      } else {
        moveUnderline(currentTab, true);
      }
    }

    if (document.prerendering) {
      document.addEventListener('prerenderingchange', initNavPosition, { once: true });
    } else {
      initNavPosition();
      document.fonts.ready.then(initNavPosition);
      document.fonts.addEventListener?.('loadingdone', () => moveUnderline(currentTab, true));
    }

    window.addEventListener('pageshow', e => { if (e.persisted) initNavPosition(); });
    window.addEventListener('resize', () => moveUnderline(currentTab, true));

    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        const active = document.querySelector('#navLinks a.active');

    let index = 0;
    let loadId = 0;
    const imgCache = new Map();

    const leftZone = document.getElementById('leftZone');
    const leftMotion = document.getElementById('leftMotion');
    const rightZone = document.getElementById('rightZone');
    const personImg = document.getElementById('personImg');
    const leftTextGroup = document.getElementById('leftTextGroup');
    const firstNameImg = document.getElementById('firstNameImg');
    const lastNameImg = document.getElementById('lastNameImg');
    const redPhoto = document.getElementById('redPhoto');
    const rightTextImg = document.getElementById('rightTextImg');
    const roleEl = document.getElementById('memberRole');

    const langBtn = document.getElementById('langToggle');
    const langLabel = document.getElementById('langText');
    let lang = localStorage.getItem('topic-lang') || 'en';

    let didInitLang = false;
    function setLanguage(code) {
      lang = code;
      html.setAttribute('lang', code);
      langLabel.textContent = code === 'en' ? 'TH' : 'EN';

      if (didInitLang || code !== 'en') {
        document.querySelectorAll('[data-en]').forEach(el => {
          el.textContent = el.getAttribute(`data-${code}`);
        });
      }
      didInitLang = true;

      const m = members[index];
      if (roleEl && m) {
        roleEl.textContent = code === 'th' ? (m.roleTh || m.roleEn) : m.roleEn;
      }

      requestAnimationFrame(() => {
        moveUnderline(document.querySelector('#navLinks a.active') || navLinks[2], true);
      });
    }

    setLanguage(lang);

    langBtn.addEventListener('click', () => {
      const next = lang === 'en' ? 'th' : 'en';
      localStorage.setItem('topic-lang', next);
      setLanguage(next);
    });

    function preloadImg(src) {
      if (!src) return Promise.resolve();
      if (imgCache.has(src)) return imgCache.get(src);

      const job = new Promise(resolve => {
        const img = new Image();
        img.src = src;
        const done = () => (img.decode ? img.decode().then(resolve).catch(resolve) : resolve());
        img.complete ? done() : (img.onload = done, img.onerror = resolve);
      });

      imgCache.set(src, job);
      return job;
    }

    const getMemberAssets = m => [m.cutout, m.firstName, m.lastName, m.redBox, m.nickname];

    function preloadAdjacent(i) {
      const next = (i + 1) % members.length;
      const prev = (i - 1 + members.length) % members.length;
      [next, prev].forEach(n => getMemberAssets(members[n]).forEach(preloadImg));
    }

    function applyMemberData(m) {
      if (personImg.getAttribute('src') !== m.cutout) personImg.src = m.cutout;
      if (firstNameImg.getAttribute('src') !== (m.firstName || '')) firstNameImg.src = m.firstName || '';
      if (lastNameImg.getAttribute('src') !== (m.lastName || '')) lastNameImg.src = m.lastName || '';
      if (redPhoto.getAttribute('src') !== m.redBox) redPhoto.src = m.redBox;
      if (rightTextImg.getAttribute('src') !== m.nickname) rightTextImg.src = m.nickname;
      roleEl.textContent = lang === 'th' ? (m.roleTh || m.roleEn) : m.roleEn;

      leftTextGroup.style.bottom = m.leftBottom || '16%';
      leftTextGroup.style.left = m.leftPos || '0px';
      leftTextGroup.style.gap = m.nameGap || '4px';
      firstNameImg.style.width = m.firstNameWidth || '330px';
      lastNameImg.style.width = m.lastNameWidth || '330px';

      personImg.style.bottom = m.personBottom || '0px';
      personImg.style.setProperty('--head-offset', m.headOffset || '20%');
      personImg.style.setProperty('--person-x', m.personX || '0px');

      rightTextImg.style.top = m.rightTop || '0px';
      rightTextImg.style.left = m.rightLeft || '5px';
    }

    let activeAnims = [];
    function clearSwitchAnims() {
      activeAnims.forEach(a => a.cancel());
      activeAnims = [];
    }

    async function renderMember(i, isInitial = false, dir = 1) {
      const token = ++loadId;
      const m = members[i];

      if (isInitial) {
        applyMemberData(m);
        return;
      }

      clearSwitchAnims();
      const isMobile = window.innerWidth <= 820;
      const fadeOpts = { duration: 110, easing: 'ease-out', fill: 'forwards' };
      const a1 = leftMotion.animate([{ opacity: getComputedStyle(leftMotion).opacity }, { opacity: 0 }], fadeOpts);
      const a2 = rightZone.animate([{ opacity: getComputedStyle(rightZone).opacity }, { opacity: 0 }], fadeOpts);
      activeAnims.push(a1, a2);

      await Promise.all([
        Promise.all(getMemberAssets(m).map(preloadImg)),
        a1.finished.catch(() => {})
      ]);
      if (token !== loadId) return;

      clearSwitchAnims();
      leftMotion.style.opacity = '0';
      rightZone.style.opacity = '0';

      applyMemberData(m);

      const domImgs = [personImg, firstNameImg, lastNameImg, redPhoto, rightTextImg].filter(el => el.getAttribute('src'));
      await Promise.all(domImgs.map(el => (el.decode ? el.decode().catch(() => {}) : Promise.resolve())));
      if (token !== loadId) return;

      leftMotion.style.opacity = '';
      rightZone.style.opacity = '';

      const easing = 'cubic-bezier(0.22, 1, 0.36, 1)';
      const offset = isMobile ? 28 : 48;
      const opts = { duration: isMobile ? 400 : 480, easing };
      activeAnims.push(
        leftMotion.animate([{ opacity: 0, transform: `translate3d(${-offset}px, 0, 0)` }, { opacity: 1, transform: 'translate3d(0, 0, 0)' }], opts),
        rightZone.animate([{ opacity: 0, transform: `translate3d(${offset}px, 0, 0)` }, { opacity: 1, transform: 'translate3d(0, 0, 0)' }], opts)
      );
      preloadAdjacent(i);
    }

    let didWarmRest = false;
    function warmAllOnIntent() {
      preloadAdjacent(index);
      if (!didWarmRest) {
        didWarmRest = true;
        const warm = () => members.forEach(m => getMemberAssets(m).forEach(preloadImg));
        'requestIdleCallback' in window ? requestIdleCallback(warm, { timeout: 2000 }) : setTimeout(warm, 400);
      }
    }

    function stepMember(dir) {
      index = (index + dir + members.length) % members.length;
      renderMember(index, false, dir);
      warmAllOnIntent();
    }

    const prevBtn = document.getElementById('prevMember');
    const nextBtn = document.getElementById('nextMember');
    prevBtn.addEventListener('click', () => stepMember(-1));
    nextBtn.addEventListener('click', () => stepMember(1));
    prevBtn.addEventListener('pointerdown', () => preloadAdjacent(index), { once: true });
    nextBtn.addEventListener('pointerdown', () => preloadAdjacent(index), { once: true });
    prevBtn.addEventListener('pointerenter', () => preloadAdjacent(index), { once: true });
    nextBtn.addEventListener('pointerenter', () => preloadAdjacent(index), { once: true });

    window.addEventListener('load', () => {
      setTimeout(() => preloadAdjacent(index), 350);
    }, { once: true });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') stepMember(-1);
      if (e.key === 'ArrowRight') stepMember(1);
    });

    let startX = 0;
    const box = document.getElementById('slideshowBox');
    box.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; preloadAdjacent(index); }, { passive: true });
    box.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - startX;
      if (Math.abs(diff) > 45) stepMember(diff < 0 ? 1 : -1);
    }, { passive: true });

    function loadFromHash(isInit = false) {
      const match = window.location.hash.match(/member=(\d+)/);
      const target = match ? Math.min(Number(match[1]), members.length - 1) : 0;
      if (isInit || target !== index) {
        index = target;
        renderMember(index, isInit);
      }
    }

    loadFromHash(true);
    window.addEventListener('hashchange', () => loadFromHash(false));

    function syncStorage() {
      html.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');
      setLanguage(localStorage.getItem('topic-lang') || 'en');
    }

    window.addEventListener('pageshow', syncStorage);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncStorage();
    });
  </script>
