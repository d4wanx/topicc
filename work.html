<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore TO•PIC Media Design Studio portfolio: graphic design, motion graphics, photography, and 3D model works." />
  <title>TO•PIC — Work</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='15' y='9' width='34' height='9.5' fill='%23111'/%3E%3Cpath d='M20 33.5H32V21.5C25.37 21.5 20 26.87 20 33.5Z' fill='%23111'/%3E%3Crect x='20' y='36.5' width='12' height='16' fill='%23111'/%3E%3Cpath d='M34 21.5C40.63 21.5 46 26.87 46 33.5C46 40.13 40.63 45.5 34 45.5V21.5Z' fill='%23b81d24'/%3E%3C/svg%3E">
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');
    } catch (e) {}

    (() => {
      let tabHash = location.hash.slice(1);
      if (tabHash === 'production') tabHash = 'photography';
      if (tabHash === 'motion' || tabHash === 'photography' || tabHash === '3d') {
        document.documentElement.dataset.initTab = tabHash;
      }

      const firstThumbs = {
        graphic: [
          'thumbs_graphic/UnboundedHorizons_MultiDesignSpace2026PosterDesign.webp',
          'thumbs_graphic/AbyssalLullaby_CharacterDesign.webp'
        ],
        photography: [
          'Photography_Tanyapron/HiddenDeal_StorytellingPhotography.webp',
          'thumbs_production/SuspendedVermilion_AtmosphericPhotography.webp'
        ],
        '3d': [
          '3D_Tanyapron/MidnightCorner_3DIsometricRoom.webp',
          '3D_Pichayada/GoldenHourReverie_3DIsometricRoom.webp'
        ]
      }[tabHash || 'graphic'];

      if (firstThumbs) {
        firstThumbs.forEach(url => {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = url;
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        });
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap"></noscript>

  <style>
    @view-transition {
      navigation: auto;
    }

    html {
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
    }

    :root,
    [data-theme="light"] {
      --container-max: 1440px;
      --side-pad: clamp(24px, 5vw, 72px);

      --bg-color: #efefef;
      --nav-bg: rgba(239, 239, 239, 0.92);
      --surface-color: #ffffff;
      --card-placeholder: #dcdcdc;
      --text-primary: #111111;
      --text-secondary: #555555;
      --accent-red: #b81d24;
      --border-color: rgba(0, 0, 0, 0.12);
      --card-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      --toggle-border: #111111;

      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.36) 50%, rgba(255, 255, 255, 0.58) 100%);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.07), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95), inset 0 -1.5px 2px rgba(0, 0, 0, 0.06);
      --glass-sheen: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
    }

    [data-theme="dark"] {
      --bg-color: #0e0e0e;
      --nav-bg: rgba(14, 14, 14, 0.92);
      --surface-color: #181818;
      --card-placeholder: #1f1f1f;
      --text-primary: #f4f4f4;
      --text-secondary: #9e9e9e;
      --accent-red: #e6323a;
      --border-color: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
      --toggle-border: #f4f4f4;

      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.1) 100%);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), inset 0 1px 1.5px rgba(255, 255, 255, 0.35), inset 0 -1.5px 2px rgba(0, 0, 0, 0.45);
      --glass-sheen: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: var(--side-pad);
      padding-right: var(--side-pad);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 88px;
      z-index: 1000;
      background-color: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      transition: background-color 0.35s ease;
    }

    .nav-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 2px;
      cursor: pointer;
    }

    .topic-logo-svg {
      width: 48px;
      height: 48px;
      overflow: visible;
      display: block;
    }

    .logo-stem,
    .logo-top-bar {
      fill: var(--text-primary);
      transition: fill 0.35s ease;
    }

    .logo-red-half {
      fill: var(--accent-red);
      transition: fill 0.35s ease;
    }

    .logo-top-bar {
      transform-box: view-box;
      transform-origin: 32px 18px;
      transform: translate(-5px, 4px) rotate(-38deg);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.35s ease;
    }

    .brand-logo:hover .logo-top-bar,
    .brand-logo:active .logo-top-bar {
      transform: translate(0, 0) rotate(0deg);
    }

    nav.nav-links {
      position: relative;
      display: flex;
      align-items: center;
      gap: 48px;
    }

    nav.nav-links a {
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.07em;
      color: var(--text-primary);
      text-transform: uppercase;
      padding: 8px 4px;
      display: inline-block;
      white-space: nowrap;
      transition: color 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    nav.nav-links a:hover {
      transform: scale(1.08);
      color: var(--accent-red);
    }

    nav.nav-links a.active {
      color: var(--accent-red);
    }

    .nav-underline {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2.5px;
      width: 1px;
      background-color: var(--accent-red);
      border-radius: 2px;
      transform-origin: left center;
      will-change: transform;
      view-transition-name: nav-underline;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .nav-controls {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.25s ease, transform 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--accent-red);
      transform: scale(1.06);
    }

    .theme-toggle {
      width: 56px;
      height: 28px;
      border-radius: 999px;
      border: 1.5px solid var(--toggle-border);
      background: transparent;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      transition: border-color 0.35s ease;
    }

    .theme-icon {
      width: 14px;
      height: 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .sun-icon { color: #fff; }
    .moon-icon { color: var(--text-primary); opacity: 0.65; }
    [data-theme="dark"] .sun-icon { color: var(--text-primary); opacity: 0.55; }
    [data-theme="dark"] .moon-icon { color: #fff; opacity: 1; }

    .theme-knob {
      position: absolute;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.35s ease;
      z-index: 1;
    }

    [data-theme="dark"] .theme-knob {
      transform: translateX(27px);
    }

    main.work {
      padding: 136px 0 96px;
    }

    .search-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 34px;
    }

    .search {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 560px;
      height: 48px;
      padding: 0 8px 0 22px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .search::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 65%;
      height: 100%;
      background: var(--glass-sheen);
      transform: skewX(-22deg);
      transition: left 0.75s ease;
      pointer-events: none;
    }

    .search:hover::before,
    .search:focus-within::before {
      left: 145%;
    }

    .search:focus-within {
      transform: scale(1.02);
      border-color: var(--accent-red);
      box-shadow:
        0 12px 32px rgba(184, 29, 36, 0.14),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1.5px 2px rgba(184, 29, 36, 0.12);
    }

    [data-theme="dark"] .search:focus-within {
      box-shadow:
        0 12px 34px rgba(230, 50, 58, 0.22),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.4),
        inset 0 -1.5px 2px rgba(230, 50, 58, 0.2);
    }

    .search__input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      padding-right: 12px;
    }

    .search__input::placeholder {
      color: var(--text-secondary);
      opacity: 0.75;
    }

    .search__input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search__divider {
      width: 1px;
      height: 22px;
      background: var(--border-color);
      margin-right: 4px;
    }

    .search__button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .search__button:hover {
      color: var(--accent-red);
      transform: scale(1.1);
    }

    .tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 44px;
    }

    .tab {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 148px;
      height: 40px;
      padding: 0 26px;
      border-radius: 999px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      font-variant-numeric: lining-nums;
      font-feature-settings: "lnum" 1;
      color: var(--text-primary);
      cursor: pointer;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.35s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 75%;
      height: 100%;
      background: var(--glass-sheen);
      transform: skewX(-22deg);
      transition: left 0.65s ease;
      pointer-events: none;
    }

    .tab:hover::before {
      left: 145%;
    }

    .tab:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: var(--accent-red);
    }

    .tab[aria-selected="true"] {
      color: #fff;
      background: linear-gradient(135deg, rgba(205, 32, 40, 0.94) 0%, rgba(156, 18, 24, 0.86) 55%, rgba(184, 29, 36, 0.92) 100%);
      border-color: rgba(255, 160, 165, 0.55);
      box-shadow:
        0 10px 26px rgba(184, 29, 36, 0.32),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55),
        inset 0 -2px 3px rgba(90, 5, 10, 0.45);
    }

    html[data-init-tab] #panel-graphic,
    .panel[hidden] {
      display: none;
    }

    .grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    #panel-motion .grid,
    #panel-photography .grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-placeholder);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      aspect-ratio: 3 / 4;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease;
    }

    #panel-graphic .card:nth-child(n+5),
    #panel-photography .card:nth-child(n+5),
    #panel-3d .card:nth-child(n+5) {
      content-visibility: auto;
      contain-intrinsic-size: 300px 400px;
    }

    #panel-motion .card,
    #panel-photography .card {
      aspect-ratio: 4 / 3;
    }

    #panel-photography .card:nth-child(n+5) {
      contain-intrinsic-size: 400px 300px;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--accent-red);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.16);
    }

    .card img,
    .card video {
      position: absolute;
      width: var(--w, 100%);
      height: var(--h, 100%);
      left: var(--l, 0%);
      top: var(--t, 0%);
      object-fit: var(--fit, cover);
      object-position: var(--pos, center center);
      display: block;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #panel-3d .card {
      background: var(--card-bg, #3f3f3f);
    }

    #panel-3d .card img {
      object-fit: var(--fit, contain);
      transform: translate(var(--tx, 0%), var(--ty, 0%)) scale(var(--s, 1));
      -webkit-mask-image: var(--mask, none);
      mask-image: var(--mask, none);
    }

    .card:hover img,
    .card:hover video {
      transform: scale(1.05);
    }

    #panel-3d .card:hover img {
      transform: translate(var(--tx, 0%), var(--ty, 0%)) scale(calc(var(--s, 1) * 1.05));
    }

    .card::after {
      content: attr(data-title-en);
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 36px 16px 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0) 100%);
      color: #fff;
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0.92;
      transition: opacity 0.3s ease, padding-bottom 0.3s ease;
    }

    html[lang="th"] .card::after {
      content: attr(data-title-th);
    }

    .card:hover::after {
      opacity: 1;
      padding-bottom: 18px;
    }

    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-secondary);
      font-size: 14px;
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    .work-detail-view {
      position: fixed;
      inset: 0;
      z-index: 950;
      background-color: var(--bg-color);
      padding: 112px 0 36px;
      overflow-y: auto;
      overflow-x: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px);
      transition: opacity 0.32s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s;
    }

    .work-detail-view.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .work-detail-view > .container {
      max-width: none;
      padding-left: max(var(--side-pad), calc((100vw - var(--container-max)) / 2 + var(--side-pad)));
      padding-right: 0;
    }

    .detail-close-btn {
      display: none;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: clamp(250px, 24vw, 350px) minmax(0, 1fr);
      align-items: center;
      gap: clamp(20px, 3vw, 48px);
      min-height: calc(100svh - 148px);
    }

    .detail-info {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .detail-info.is-switching {
      opacity: 0.25;
      transform: translateY(6px);
    }

    .detail-title {
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      font-size: clamp(24px, 2.5vw, 33px);
      font-weight: 800;
      line-height: 1.22;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    .detail-subtitle {
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .detail-desc {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      font-size: 14.5px;
      line-height: 1.68;
      color: var(--text-secondary);
      max-width: 350px;
      margin-bottom: 22px;
    }

    .detail-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .detail-price-row { color: var(--accent-red); }
    .detail-format-row { color: var(--text-primary); }

    .detail-author-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      font-family: 'Playfair Display', 'Noto Sans Thai', Georgia, serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-red);
    }

    .detail-author-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--accent-red);
      padding: 5px 10px;
      border-radius: 999px;
      background-color: transparent;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .detail-author-link strong {
      border-bottom: 1.5px dashed rgba(184, 29, 36, 0.55);
      padding-bottom: 1px;
      transition: border-color 0.25s ease;
    }

    .detail-author-link .author-arrow {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      opacity: 0.75;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .detail-author-link:hover {
      background-color: #fff;
      color: #b81d24;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }

    .detail-author-link:hover strong { border-bottom-color: transparent; }
    .detail-author-link:hover .author-arrow { opacity: 1; transform: translate(2px, -2px); }
    .detail-author-sep { opacity: 0.55; user-select: none; }

    .detail-gallery-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 20px 0;
    }

    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background-color: #fff;
      color: #111;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      z-index: 25;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    }

    [data-theme="dark"] .gallery-nav-btn {
      background-color: #242424;
      color: #f4f4f4;

    .gallery-slide {

      aspect-ratio: 3 / 3.9;
      max-height: 62svh;

      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);

      filter: brightness(1);

              <span data-en="Price" data-th="ราคา">Price</span> : <span id="detailPrice">1,200 THB</span>
            </div>
            <div class="detail-format-row">
              <span data-en="Format" data-th="ไฟล์งาน">Format</span> : <span id="detailFormat">.AI / .PNG</span>
            </div>
          </div>

          <div class="detail-author-row" id="detailAuthorRow">
            <span>BY :</span>
            <a href="team.html" class="detail-author-link">
              <strong>PICHAYADA</strong>
              <span class="author-arrow" aria-hidden="true">↗</span>
            </a>
          </div>
        </div>

        <div class="detail-gallery-wrap" id="detailGalleryWrap">
          <button class="gallery-nav-btn" id="galleryPrevBtn" type="button" aria-label="Previous image">←</button>
          <div class="gallery-viewport">
            <div class="gallery-track" id="galleryTrack"></div>
          </div>
          <button class="gallery-nav-btn" id="galleryNextBtn" type="button" aria-label="Next image">→</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const html = document.documentElement;

    const themeToggle = document.getElementById('themeToggle');
    html.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');

    themeToggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('topic-theme', next);
    });

    const navLinks = [...document.querySelectorAll('#navLinks a')];
    const underline = document.getElementById('navUnderline');
    const currentTab = document.querySelector('#navLinks a.active') || navLinks[1];

    function moveUnderline(link, instant = false) {
      if (!link || !underline) return;
      navLinks.forEach(a => a.classList.remove('active'));
      link.classList.add('active');

      const x = link.offsetLeft;
      const w = link.offsetWidth;

      if (instant) {
        underline.style.transition = 'none';
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
        underline.offsetHeight;
        underline.style.transition = '';
      } else {
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
      }
    }

    function initNavPosition() {
      const saved = sessionStorage.getItem('topic-prev-nav');
      if (saved) {
        sessionStorage.removeItem('topic-prev-nav');
        const { x, w } = JSON.parse(saved);
        underline.style.transition = 'none';
        underline.style.transform = `translate3d(${x}px, 0, 0) scaleX(${w})`;
        underline.offsetHeight;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            underline.style.transition = '';
            moveUnderline(currentTab, false);
          });
        });
      } else {
        moveUnderline(currentTab, true);
      }
    }

    if (document.prerendering) {
      document.addEventListener('prerenderingchange', initNavPosition, { once: true });
    } else {
      initNavPosition();
      document.fonts.ready.then(initNavPosition);
      document.fonts.addEventListener?.('loadingdone', () => moveUnderline(currentTab, true));
    }

    window.addEventListener('pageshow', e => { if (e.persisted) initNavPosition(); });
    window.addEventListener('resize', () => moveUnderline(currentTab, true));

    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        const active = document.querySelector('#navLinks a.active');
        if (active && active !== link) {
          sessionStorage.setItem('topic-prev-nav', JSON.stringify({
            x: active.offsetLeft,
            w: active.offsetWidth
          }));
        }
      });
    });

    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('.panel')];
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');

    let activeCategory = 'graphic';

    function filterCards() {
      const q = searchInput.value.trim().toLowerCase();
      const panel = document.getElementById(`panel-${activeCategory}`);
      if (!panel) return;
      if (!q && !panel.dataset.filtered) {
        emptyState.classList.remove('show');
        return;
      }

      panel.dataset.filtered = q ? '1' : '';
      let shown = 0;
      panel.querySelectorAll('.card').forEach(card => {
        const text = [
          card.dataset.titleEn,
          card.dataset.titleTh,
          card.querySelector('img')?.alt
        ].join(' ').toLowerCase();

        const match = !q || text.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) shown++;
      });

      emptyState.classList.toggle('show', shown === 0);
    }

    function selectTab(tab) {
      activeCategory = tab.dataset.tab;
      delete document.documentElement.dataset.initTab;

      tabs.forEach(t => {
        const selected = t === tab;
        t.setAttribute('aria-selected', selected);
        t.tabIndex = selected ? 0 : -1;
      });

      panels.forEach(p => { p.hidden = p.id !== `panel-${activeCategory}`; });
      promoteTopImages(activeCategory);

      history.replaceState(null, '', `#${activeCategory}`);
      filterCards();
    }

    function promoteTopImages(cat) {
      const panel = document.getElementById(`panel-${cat}`);
      if (!panel) return;
      [...panel.querySelectorAll('img[data-src]')].slice(0, 4).forEach((img, idx) => {
        if (idx < 2) img.fetchPriority = 'high';
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
    }

    tabs.forEach(tab => tab.addEventListener('click', () => selectTab(tab)));

    const rawHash = window.location.hash.slice(1);
    const hash = rawHash === 'production' ? 'photography' : rawHash;
    const matchedTab = tabs.find(t => t.dataset.tab === hash);
    if (matchedTab) {
      selectTab(matchedTab);
    } else {
      promoteTopImages('graphic');
      filterCards();
    }

    searchInput.addEventListener('input', filterCards);
    searchForm.addEventListener('submit', e => {
      e.preventDefault();
      filterCards();
    });

    const detailView = document.getElementById('workDetailView');
    const detailInfo = document.querySelector('.detail-info');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const detailPrice = document.getElementById('detailPrice');
    const detailFormat = document.getElementById('detailFormat');
    const detailAuthorRow = document.getElementById('detailAuthorRow');
    const galleryTrack = document.getElementById('galleryTrack');
    const galleryViewport = galleryTrack.parentElement;
    const prevBtn = document.getElementById('galleryPrevBtn');
    const nextBtn = document.getElementById('galleryNextBtn');
    const galleryWrap = document.getElementById('detailGalleryWrap');
    const detailCloseBtn = document.getElementById('detailCloseBtn');

    let currentCards = [];
    let currentCard = null;
    let slideIdx = 0;

    const isMobileDetail = () => window.innerWidth <= 860;

    const TEAM_INDEX = {
      PICHAYADA: 0, BAM: 0,
      YANISA: 1, PUPE: 1, POUPEE: 1,
      TANYAPRON: 2, ELLE: 2,
      SURACHART: 3, BOOK: 3,
      JIRAPHAT: 4, BOOM: 4,
      CHACHANON: 5, AU: 5,
      PATTADON: 6, STARDA: 6, STRADA: 6,
      NATCHA: 7, MOOK: 7,
      SIWAKRON: 8, SIVAKRON: 8, ARM: 8,
      THANAPAT: 9, THANAPHAT: 9, TON: 9,
      KROM: 10, GUN: 10
    };

    function renderDetailInfo(card, animate = false) {
      if (!card) return;
      currentCard = card;
      const lang = html.getAttribute('lang') || 'en';

      const fillData = () => {
        detailTitle.textContent = card.getAttribute(`data-title-${lang}`) || card.dataset.titleEn || 'Untitled Work';
        detailDesc.textContent = card.getAttribute(`data-desc-${lang}`) || card.dataset.descEn || (lang === 'th' ? 'รายละเอียดผลงานและแนวคิดการออกแบบ' : 'Design concept and visual exploration.');
        detailPrice.textContent = card.dataset.price || '1,200 THB';
        detailFormat.textContent = (card.dataset.format || '.AI / .PNG').replace(/\s*,\s*/g, ' / ');

        const authors = (card.dataset.by || 'TO•PIC STUDIO').split('/').map(s => s.trim()).filter(Boolean);
        detailAuthorRow.innerHTML = '<span>BY :</span>' + authors.map((name, idx) => {
          const memberId = TEAM_INDEX[name.toUpperCase()];
          const href = memberId !== undefined ? `team.html#member=${memberId}` : 'team.html';
          const sep = idx > 0 ? '<span class="detail-author-sep">/</span>' : '';
          return `${sep}<a href="${href}" class="detail-author-link"><strong>${name}</strong><span class="author-arrow" aria-hidden="true">↗</span></a>`;
        }).join('');
      };

      if (animate && detailInfo) {
        detailInfo.classList.add('is-switching');
        setTimeout(() => {
          fillData();
          detailInfo.classList.remove('is-switching');
        }, 140);
      } else {
        fillData();
      }
    }

    function preloadAdjacent(slides, center) {
      [center - 1, center, center + 1].forEach(i => {
        const img = slides[i]?.querySelector('img[data-src]');
        if (img) {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        }
      });

      slides.forEach((s, i) => {
        const vid = s.querySelector('video');
        if (!vid) return;
        if (i === center) {
          vid.dataset.wantPlay = '1';
          vid.muted = true;
          vid.defaultMuted = true;
          vid.playsInline = true;
          vid.loop = true;
          if (vid.dataset.src) {
            vid.preload = 'auto';
            vid.src = vid.dataset.src;
            vid.removeAttribute('data-src');
            vid.load();
          }
          if (!vid.dataset.boundPlay) {
            vid.dataset.boundPlay = '1';
            const tryPlay = () => {
              if (vid.dataset.wantPlay === '1' && vid.paused) vid.play().catch(() => {});
            };
            vid.addEventListener('loadeddata', tryPlay);
            vid.addEventListener('canplay', tryPlay);
          }
          vid.play().catch(() => {});
        } else {
          vid.dataset.wantPlay = '0';
          if (!vid.paused) vid.pause();
        }
      });
    }

    function updateCarousel(animateText = true, syncMobileScroll = true) {
      const slides = [...galleryTrack.querySelectorAll('.gallery-slide')];
      if (!slides.length) return;

      preloadAdjacent(slides, slideIdx);

      slides.forEach((s, i) => {
        s.classList.toggle('is-current', i === slideIdx);
        s.classList.toggle('is-prev', i < slideIdx);
        s.classList.toggle('is-next', i > slideIdx);
      });

      const activeSlide = slides[slideIdx];
      const vw = galleryViewport.clientWidth;
      const sw = activeSlide.offsetWidth;

      if (isMobileDetail()) {
        galleryTrack.style.transform = '';
        if (syncMobileScroll) {
          const targetLeft = Math.max(0, activeSlide.offsetLeft - (vw - sw) / 2);
          if (animateText) {
            programmaticScrollUntil = Date.now() + 550;
            galleryViewport.scrollTo({ left: targetLeft, behavior: 'smooth' });
          } else {
            programmaticScrollUntil = Date.now() + 180;
            galleryViewport.style.scrollSnapType = 'none';
            galleryViewport.scrollLeft = targetLeft;
            requestAnimationFrame(() => {
              galleryViewport.scrollLeft = targetLeft;
              galleryViewport.style.scrollSnapType = '';
            });
          }
        }
      } else {
        const offset = activeSlide.offsetLeft - (vw - sw) / 2;
        galleryTrack.style.transform = `translate3d(${-offset}px, 0, 0)`;
        prevBtn.style.left = `${Math.max(8, (vw - sw) / 2 - 47)}px`;
        nextBtn.style.left = `${Math.min(vw - 46, (vw + sw) / 2 + 9)}px`;
      }

      prevBtn.disabled = slideIdx <= 0;
      nextBtn.disabled = slideIdx >= currentCards.length - 1;

      renderDetailInfo(currentCards[slideIdx], animateText);
    }

    let scrollTimer = null;
    let programmaticScrollUntil = 0;
    galleryViewport.addEventListener('scroll', () => {
      if (!isMobileDetail() || !detailView.classList.contains('is-open')) return;
      if (Date.now() < programmaticScrollUntil) return;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        if (Date.now() < programmaticScrollUntil) return;
        const slides = [...galleryTrack.querySelectorAll('.gallery-slide')];
        if (!slides.length) return;

        const centerX = galleryViewport.scrollLeft + galleryViewport.clientWidth / 2;
        let closest = 0;
        let minDiff = Infinity;

        slides.forEach((s, i) => {
          const slideCenter = s.offsetLeft + s.offsetWidth / 2;
          const diff = Math.abs(centerX - slideCenter);
          if (diff < minDiff) {
            minDiff = diff;
            closest = i;
          }
        });

        if (closest !== slideIdx) {
          slideIdx = closest;
          updateCarousel(true, false);
        }
      }, 60);
    }, { passive: true });

    function openDetail(card) {
      const panel = card.closest('.panel');
      currentCards = panel ? [...panel.querySelectorAll('.card')] : [card];

      const isLandscape = panel && (panel.id === 'panel-motion' || panel.id === 'panel-photography');
      galleryWrap.classList.toggle('is-landscape', Boolean(isLandscape));
      galleryWrap.classList.toggle('is-3d', panel?.id === 'panel-3d');

      slideIdx = Math.max(0, currentCards.indexOf(card));
      galleryTrack.innerHTML = '';

      currentCards.forEach((c, i) => {
        const slide = document.createElement('div');
        slide.className = 'gallery-slide';
        if (c.style.cssText) slide.style.cssText = c.style.cssText;

        const vid = c.querySelector('video');
        const img = c.querySelector('img');

        if (vid) {
          const src = vid.getAttribute('src') || vid.dataset.src || '';
          const attr = i === slideIdx ? `src="${src}" autoplay` : `data-src="${src}" preload="none"`;
          slide.innerHTML = `<video ${attr} loop muted playsinline></video>`;
        } else {
          const src = img ? (img.dataset.full || img.getAttribute('src') || img.dataset.src || '') : '';
          const alt = c.dataset.titleEn || '';
          const attr = Math.abs(i - slideIdx) <= 1 ? `src="${src}"` : `data-src="${src}"`;
          slide.innerHTML = `<img ${attr} alt="${alt}" decoding="async">`;
        }

        slide.addEventListener('click', () => {
          if (i !== slideIdx) {
            slideIdx = i;
            updateCarousel(true, true);
          }
        });

        galleryTrack.appendChild(slide);
      });

      detailView.scrollTop = 0;
      detailView.classList.add('is-open');
      detailView.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      galleryTrack.style.transition = 'none';
      updateCarousel(false, true);
      requestAnimationFrame(() => { galleryTrack.style.transition = ''; });
    }

    function closeDetail() {
      detailView.classList.remove('is-open');
      detailView.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      currentCard = null;
      galleryTrack.querySelectorAll('video').forEach(v => v.pause());
    }

    detailCloseBtn.addEventListener('click', closeDetail);

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openDetail(card));
    });

    navLinks.forEach(link => {
      if (link.dataset.nav === 'work') {
        link.addEventListener('click', e => {
          if (detailView.classList.contains('is-open')) {
            e.preventDefault();
            closeDetail();
          }
        });
      }
    });

    prevBtn.addEventListener('click', () => {
      if (slideIdx > 0) { slideIdx--; updateCarousel(true, true); }
    });

    nextBtn.addEventListener('click', () => {
      if (slideIdx < currentCards.length - 1) { slideIdx++; updateCarousel(true, true); }
    });

    window.addEventListener('resize', () => {
      if (detailView.classList.contains('is-open')) {
        galleryTrack.style.transition = 'none';
        updateCarousel(false, true);
        requestAnimationFrame(() => { galleryTrack.style.transition = ''; });
      }
    });

    window.addEventListener('keydown', e => {
      if (!detailView.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeDetail();
      if (e.key === 'ArrowLeft' && slideIdx > 0) { slideIdx--; updateCarousel(true, true); }
      if (e.key === 'ArrowRight' && slideIdx < currentCards.length - 1) { slideIdx++; updateCarousel(true, true); }
    });

    const langBtn = document.getElementById('langToggle');
    const langLabel = document.getElementById('langText');
    let lang = localStorage.getItem('topic-lang') || 'en';

    let didInitLang = false;
    function setLanguage(code) {
      lang = code;
      html.setAttribute('lang', code);
      langLabel.textContent = code === 'en' ? 'TH' : 'EN';

      if (didInitLang || code !== 'en') {
        document.querySelectorAll('[data-en]').forEach(el => {
          el.textContent = el.getAttribute(`data-${code}`);
        });
        const ph = searchInput.getAttribute(`data-placeholder-${code}`);
        if (ph) searchInput.placeholder = ph;
      }
      didInitLang = true;

      if (currentCard) renderDetailInfo(currentCard, false);

      requestAnimationFrame(() => {
        moveUnderline(document.querySelector('#navLinks a.active') || navLinks[1], true);
      });
    }

    setLanguage(lang);

    langBtn.addEventListener('click', () => {
      const next = lang === 'en' ? 'th' : 'en';
      localStorage.setItem('topic-lang', next);
      setLanguage(next);
    });

    function syncStorage() {
      html.setAttribute('data-theme', localStorage.getItem('topic-theme') || 'light');
      setLanguage(localStorage.getItem('topic-lang') || 'en');
    }

    window.addEventListener('pageshow', syncStorage);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncStorage();
    });

    const motionVideos = [...document.querySelectorAll('#panel-motion video')];
    function ensureVideoPlay(v) {
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.loop = true;
      v.dataset.wantPlay = '1';
      if (!v.getAttribute('src') && v.dataset.src) {
        v.preload = 'auto';
        v.src = v.dataset.src;
        v.load();
      }
      if (v.paused) {
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      }
    }

    motionVideos.forEach(v => {
      const src = v.getAttribute('src');
      if (src) {
        v.dataset.src = src;
        v.removeAttribute('src');
      }
      const tryResume = () => {
        if (v.dataset.wantPlay === '1' && activeCategory === 'motion' && v.paused) {
          v.play().catch(() => {});
        }
      };
      v.addEventListener('loadeddata', tryResume);
      v.addEventListener('canplay', tryResume);
    });

    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const v = entry.target;
        if (entry.isIntersecting && activeCategory === 'motion') {
          ensureVideoPlay(v);
        } else {
          v.dataset.wantPlay = '0';
          if (v.getAttribute('src') && !v.paused) v.pause();
        }
      });
    }, { rootMargin: '50px 0px' });

    let motionObserved = false;
    function loadMotionVideos(cat) {
      if (cat !== 'motion') {
        motionVideos.forEach(v => {
          v.dataset.wantPlay = '0';
          if (v.getAttribute('src') && !v.paused) v.pause();
        });
        return;
      }
      requestAnimationFrame(() => {
        if (!motionObserved) {
          motionObserved = true;
          motionVideos.forEach(v => videoObserver.observe(v));
        }
        motionVideos.forEach(v => {
          const r = v.getBoundingClientRect();
          if (r.bottom >= -50 && r.top <= window.innerHeight + 50) {
            ensureVideoPlay(v);
          }
        });
      });
    }

    loadMotionVideos(activeCategory);
    tabs.forEach(tab => tab.addEventListener('click', () => loadMotionVideos(tab.dataset.tab)));

    document.querySelectorAll('.panel img').forEach(img => { img.decoding = 'async'; });

    const lazyImgs = [...document.querySelectorAll('.panel img[data-src]')];
    const imgObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        if (img.dataset.src) {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        }
        obs.unobserve(img);
      });
    }, { rootMargin: '40px 0px' });

    lazyImgs.forEach(img => imgObserver.observe(img));
  </script>
</body>
</html>
